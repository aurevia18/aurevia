services:
  - type: web
    name: aurevia-invest
    runtime: node
    plan: starter
    region: oregon
    rootDir: aurevia-main
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate && npx prisma migrate status
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REGISTRATION_VERIFICATION_ENABLED
        value: "false"
      - key: PHONE_VERIFICATION_REQUIRED
        value: "false"
      - key: MARKET_TICK_MS
        value: "2500"
      - key: ALPACA_PROVIDER
        value: alpaca
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets/v2
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER_ORDERS_ENABLED
        value: "true"
      - key: REAL_EXECUTION_ENABLED
        value: "false"
